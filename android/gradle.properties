# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Build only ARM ABIs for smaller release APKs (covers all physical devices).
reactNativeArchitectures=armeabi-v7a,arm64-v8a

hermesEnabled=true
edgeToEdgeEnabled=false
newArchEnabled=true

# newArchEnabled=false

# R8 full mode for better code shrinking
android.enableR8.fullMode=true

# Release signing (override in CI or local.properties if needed)
MYAPP_UPLOAD_STORE_FILE=my-release-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=my-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=ayurmuni
MYAPP_UPLOAD_KEY_PASSWORD=ayurmuni
